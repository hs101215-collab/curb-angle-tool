<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>歩車道ブロック 切断計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f13;color:#f7f9fb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.w{max-width:820px;margin:auto;padding:14px 14px 40px}.c{background:#131920;border:1px solid #25303b;border-radius:18px;padding:14px;margin:12px 0}
h1{font-size:22px;margin:6px 0}h2{font-size:16px;margin:0 0 10px}.sub,.tip,.sm{color:#9fb0c0}.sub{font-size:13px}.tip{font-size:12px;line-height:1.5;margin-top:8px}.sm{font-size:11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#9fb0c0;margin:0 0 5px}input,select,button{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #33414f;background:#0e141a;color:#fff}
.hidden{display:none}canvas{width:100%;display:block;background:#0a0d10;border-radius:14px;touch-action:none}.cw{position:relative}.badge{position:absolute;left:10px;top:10px;background:#000b;padding:7px 10px;border-radius:999px;font-size:12px;pointer-events:none}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0e151b;border:1px solid #26323d;border-radius:14px;padding:12px}.big{font-size:25px;font-weight:800;color:#79c0ff}.green{color:#7ee787}.full{grid-column:1/-1}
.diagram{background:#fff;color:#111;border-radius:14px;padding:12px;text-align:center}.warn{background:#211b0e;border:1px solid #5f4b17;color:#f2cc60;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}
</style></head><body><div class="w">
<h1>歩車道ブロック 切断計算</h1><div class="sub">JIS寸法選択・片面Rの向き・写真3点測定・角度手入力</div>

<div class="c"><h2>1. ブロック</h2>
<div class="row"><div><label>種類</label><select id="type"><option value="single">片面歩車道境界</option><option value="double">両面歩車道境界</option><option value="ground">地先境界</option><option value="custom">規格外（手入力）</option></select></div>
<div><label>サイズ</label><select id="size"><option>A</option><option selected>B</option><option>C</option></select></div></div>
<div id="orientRow" style="margin-top:10px"><label>片面Rの位置</label><select id="orient"><option value="inner">R側が曲がりの内側</option><option value="outer">R側が曲がりの外側</option></select></div>
<div class="row" style="margin-top:10px">
<div><label>a 天端幅 mm</label><input id="a" type="number"></div><div><label>b 底面幅 mm</label><input id="b" type="number"></div>
<div><label>h 高さ mm</label><input id="h" type="number"></div><div><label>r 半径 mm</label><input id="r" type="number"></div><div><label>L 長さ mm</label><input id="L" type="number"></div></div>
<div class="tip">送ってもらった寸法表の標準値を登録。数値は直接変更もできます。</div></div>

<div class="c"><h2>2. 曲がり角度</h2>
<label>直接入力（写真なしでもOK）</label><input id="turn" type="number" inputmode="decimal" step=".1" placeholder="例：60">
<div class="tip">例：60° → 左右均等なら1本30°切り。</div>
<label style="margin-top:14px">または写真から測る</label><input id="file" type="file" accept="image/*" capture="environment">
<div class="cw" style="margin-top:8px"><canvas id="cv" width="900" height="520"></canvas><div id="badge" class="badge">① 頂点</div></div>
<div class="tip">①頂点 → ②左方向 → ③右方向。スマホのタップに対応。</div>
<div class="row" style="margin-top:8px"><button id="undo">1点戻す</button><button id="reset">全部消す</button></div></div>

<div class="c"><h2>3. 墨出し</h2><div id="none" class="sm">角度を入力すると表示されます。</div>
<div id="results" class="res hidden">
<div class="box"><div class="sm">1本の切断角度</div><div class="big green"><span id="ang"></span>°</div></div>
<div class="box"><div class="sm">曲がり角度</div><div class="big green"><span id="tout"></span>°</div></div>
<div class="box"><div class="sm">天端 a の墨差</div><div class="big"><span id="top"></span> mm</div></div>
<div class="box"><div class="sm">底面 b の墨差</div><div class="big"><span id="bot"></span> mm</div></div>
<div class="box full"><div class="diagram"><div id="shapeText" style="font-size:18px;font-weight:800"></div><div id="guide" style="margin-top:8px;font-size:16px"></div><div id="dims" style="margin-top:8px;font-size:13px"></div></div></div>
</div>
<div class="warn">墨差は平面上の留め切りとして「幅 × tan(切断角度)」で計算。Rの曲面途中の立体的な切断線は、製品形状と現物合わせでも確認してください。</div></div></div>

<script>
const $=x=>document.getElementById(x);
const specs={
 single:{A:[150,170,200,20,600],B:[180,205,250,30,600],C:[180,210,300,30,600]},
 double:{A:[150,190,200,20,600],B:[180,230,250,30,600],C:[180,240,300,30,600]},
 ground:{A:[120,120,120,0,600],B:[150,150,120,0,600],C:[150,150,150,0,600]}
};
function setSpec(){let t=$('type').value,s=$('size').value;$('orientRow').classList.toggle('hidden',t!=='single');$('size').disabled=t==='custom';
 if(t!=='custom'){let v=specs[t][s];['a','b','h','r','L'].forEach((id,i)=>$(id).value=v[i]);} calc();}
function calc(){let a=parseFloat($('a').value),b=parseFloat($('b').value),t=parseFloat($('turn').value);
 if(!(a>0&&b>0&&t>0&&t<180)){$('results').classList.add('hidden');$('none').classList.remove('hidden');return;}
 let ang=t/2,k=Math.tan(ang*Math.PI/180),typ=$('type').value,o=$('orient').value;
 $('ang').textContent=ang.toFixed(1);$('tout').textContent=t.toFixed(1);$('top').textContent=(a*k).toFixed(1);$('bot').textContent=(b*k).toFixed(1);
 if(typ==='single'){ $('shapeText').textContent='片面R：'+(o==='inner'?'R側が内側':'R側が外側');
 $('guide').textContent=o==='inner'?'R側を曲がり内側として墨位置を確認':'Rと反対側を曲がり内側として墨位置を確認';}
 else if(typ==='double'){$('shapeText').textContent='両面R（左右対称）';$('guide').textContent='曲がりの内側を基準に墨位置を確認';}
 else {$('shapeText').textContent=typ==='ground'?'地先境界':'規格外';$('guide').textContent='曲がりの内側を基準に墨位置を確認';}
 $('dims').textContent='a='+a+' / b='+b+' / h='+$('h').value+' / r='+$('r').value+' / L='+$('L').value+' mm';
 $('results').classList.remove('hidden');$('none').classList.add('hidden');}
$('type').onchange=setSpec;$('size').onchange=setSpec;$('orient').onchange=calc;
['a','b','h','r','L','turn'].forEach(id=>$(id).addEventListener('input',calc));

const cv=$('cv'),ctx=cv.getContext('2d');let img=new Image(),has=false,pts=[],lastTouch=0;
function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(has){let s=Math.min(cv.width/img.width,cv.height/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(cv.width-w)/2,(cv.height-h)/2,w,h)}
 else{ctx.fillStyle='#0a0d10';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#8796a5';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('写真を選んでください',cv.width/2,cv.height/2);}
 if(pts.length>1){ctx.lineWidth=7;ctx.strokeStyle='#5da9ff';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.stroke();}
 if(pts.length>2){ctx.strokeStyle='#56d364';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.stroke();}
 pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,16,0,Math.PI*2);ctx.fillStyle=i===0?'#ffcc66':i===1?'#5da9ff':'#56d364';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();});}
function badge(){$('badge').textContent=pts.length===0?'① 頂点':pts.length===1?'② 左方向':pts.length===2?'③ 右方向':'測定完了';}
function addPoint(x,y){if(pts.length>=3)return;let q=cv.getBoundingClientRect();pts.push({x:(x-q.left)*cv.width/q.width,y:(y-q.top)*cv.height/q.height});draw();badge();
 if(pts.length===3){let A={x:pts[1].x-pts[0].x,y:pts[1].y-pts[0].y},B={x:pts[2].x-pts[0].x,y:pts[2].y-pts[0].y},d=Math.hypot(A.x,A.y)*Math.hypot(B.x,B.y);
 if(d){let c=(A.x*B.x+A.y*B.y)/d,inc=Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI;$('turn').value=(180-inc).toFixed(1);calc();}}}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);img.onload=()=>{has=true;pts=[];draw();badge();URL.revokeObjectURL(u)};img.src=u;};
cv.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=Date.now();let t=e.changedTouches[0];if(t)addPoint(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||Date.now()-lastTouch<700)return;addPoint(e.clientX,e.clientY);});
$('undo').onclick=()=>{pts.pop();draw();badge();};$('reset').onclick=()=>{pts=[];draw();badge();};
setSpec();draw();badge();
</script></body></html>
