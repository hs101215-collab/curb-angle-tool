<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>歩車道ブロック 角度・切断計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f13;color:#f7f9fb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:820px;margin:auto;padding:14px 14px 40px}.card{background:#131920;border:1px solid #25303b;border-radius:18px;padding:14px;margin:12px 0}h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 10px}.sub,.tip,.small{color:#9fb0c0}.sub{font-size:13px}.tip{font-size:12px;line-height:1.55;margin-top:8px}.small{font-size:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:block;font-size:12px;color:#9fb0c0;margin-bottom:5px}input,select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #33414f;background:#0e141a;color:#fff;padding:12px}button{font-weight:700}.hidden{display:none}canvas{width:100%;display:block;background:#0a0d10;border-radius:14px;touch-action:none}.cw{position:relative}.badge{position:absolute;left:10px;top:10px;background:#000b;padding:7px 10px;border-radius:999px;font-size:12px}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#0e151b;border:1px solid #26323d;border-radius:14px;padding:12px}.full{grid-column:1/-1}.big{font-size:26px;font-weight:800;color:#79c0ff;margin-top:4px}.angle{color:#7ee787}.warn{margin-top:10px;background:#211b0e;border:1px solid #5f4b17;color:#f2cc60;border-radius:12px;padding:10px;font-size:12px;line-height:1.55}.kv{display:flex;justify-content:space-between;border-top:1px solid #2a3642;padding:9px 0;font-size:13px}.kv:first-child{border-top:0}
</style></head>
<body><div class="wrap">
<h1>歩車道ブロック 角度・切断計算</h1>
<div class="sub">写真測定＋通常・片R・両Rなど、上面と下面で幅が違うブロックに対応</div>

<div class="card"><h2>1. 写真から角度を測る</h2>
<input id="file" type="file" accept="image/*" capture="environment">
<div class="cw" style="margin-top:10px"><canvas id="cv" width="900" height="600"></canvas><div id="badge" class="badge">① 頂点</div></div>
<div class="tip">①曲がりの頂点 → ②左方向 → ③右方向 の順にタップ。</div>
<div class="row" style="margin-top:10px"><button id="undo">1点戻す</button><button id="reset">全部消す</button></div>
</div>

<div class="card"><h2>2. ブロック寸法</h2>
<div class="row">
<div><label>形状</label><select id="shape"><option value="same">上下同じ幅</option><option value="diff">上幅・下幅が違う（片R・両Rなど）</option></select></div>
<div><label>単位</label><select id="unit"><option value="cm">cm</option><option value="mm">mm</option></select></div>
</div>
<div id="same" style="margin-top:10px"><label>ブロック幅</label><input id="width" type="number" inputmode="decimal" step="0.1" value="17"></div>
<div id="diff" class="row hidden" style="margin-top:10px">
<div><label>上側の幅</label><input id="topWidth" type="number" inputmode="decimal" step="0.1" value="18"></div>
<div><label>下側の幅</label><input id="bottomWidth" type="number" inputmode="decimal" step="0.1" value="23"></div>
</div>
<div class="tip">R形状の場合は、切断する位置での上面の幅と下面の幅を入力。</div>
<div class="row" style="margin-top:10px">
<div><label>曲がり角度</label><input id="turn" type="number" inputmode="decimal" step="0.1" placeholder="写真測定で自動入力"></div>
<div><label>切り分け</label><select id="split"><option value="equal">左右均等</option><option value="custom">左右別角度</option></select></div>
</div>
<div id="custom" class="row hidden" style="margin-top:10px">
<div><label>左切断角度</label><input id="leftAngle" type="number" step="0.1" value="30"></div>
<div><label>右切断角度</label><input id="rightAngle" type="number" step="0.1" value="30"></div>
</div></div>

<div class="card"><h2>3. 墨出し寸法</h2>
<div id="nores" class="small">角度を入力すると表示されます。</div>
<div id="results" class="result hidden">
<div class="box"><div class="small">左切断角度</div><div class="big angle"><span id="la"></span>°</div></div>
<div class="box"><div class="small">右切断角度</div><div class="big angle"><span id="ra"></span>°</div></div>
<div class="box"><div class="small">左・上面</div><div class="big"><span id="lt"></span><span class="u"></span></div><div class="small">左・下面：<b id="lb"></b><span class="u"></span></div></div>
<div class="box"><div class="small">右・上面</div><div class="big"><span id="rt"></span><span class="u"></span></div><div class="small">右・下面：<b id="rb"></b><span class="u"></span></div></div>
<div class="box full"><div class="kv"><span>写真上の内角</span><b id="inc">—</b></div><div class="kv"><span>曲がり角度</span><b id="tout">—</b></div><div class="kv"><span>計算</span><b>各幅 × tan(切断角度)</b></div></div>
</div>
<div class="warn">上面・下面の墨寸法を別々に表示します。Rの曲面途中は形状によって変わるため、実際の切断前に現物で確認してください。</div>
</div></div>
<script>
const $=x=>document.getElementById(x),cv=$('cv'),ctx=cv.getContext('2d');let img=new Image(),has=false,pts=[],included=null;
function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(has){let s=Math.min(cv.width/img.width,cv.height/img.height),w=img.width*s,h=img.height*s;ctx.drawImage(img,(cv.width-w)/2,(cv.height-h)/2,w,h)}else{ctx.fillStyle='#0a0d10';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#8796a5';ctx.font='28px sans-serif';ctx.textAlign='center';ctx.fillText('写真を選んでください',cv.width/2,cv.height/2)}if(pts.length>1){ctx.lineWidth=7;ctx.strokeStyle='#5da9ff';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.stroke()}if(pts.length>2){ctx.strokeStyle='#56d364';ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[2].x,pts[2].y);ctx.stroke()}pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fillStyle=i==0?'#ffcc66':i==1?'#5da9ff':'#56d364';ctx.fill()})}
function bd(){$('badge').textContent=pts.length==0?'① 頂点':pts.length==1?'② 左方向':pts.length==2?'③ 右方向':'測定完了'}
function photoCalc(){let a={x:pts[1].x-pts[0].x,y:pts[1].y-pts[0].y},b={x:pts[2].x-pts[0].x,y:pts[2].y-pts[0].y};let c=(a.x*b.x+a.y*b.y)/(Math.hypot(a.x,a.y)*Math.hypot(b.x,b.y));included=Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI;$('turn').value=(180-included).toFixed(1);calc()}
function calc(){let d=$('shape').value=='diff',wt=d?+$('topWidth').value:+$('width').value,wb=d?+$('bottomWidth').value:+$('width').value,t=+$('turn').value;if(!(wt>0&&wb>0&&t>=0&&t<180)){$('results').classList.add('hidden');$('nores').classList.remove('hidden');return}let la=$('split').value=='equal'?t/2:+$('leftAngle').value,ra=$('split').value=='equal'?t/2:+$('rightAngle').value;if(!(la>=0&&la<89.9&&ra>=0&&ra<89.9))return;let f=a=>Math.tan(a*Math.PI/180);$('la').textContent=la.toFixed(1);$('ra').textContent=ra.toFixed(1);$('lt').textContent=(wt*f(la)).toFixed(1);$('lb').textContent=(wb*f(la)).toFixed(1);$('rt').textContent=(wt*f(ra)).toFixed(1);$('rb').textContent=(wb*f(ra)).toFixed(1);document.querySelectorAll('.u').forEach(e=>e.textContent=$('unit').value);$('inc').textContent=included==null?'手入力':included.toFixed(1)+'°';$('tout').textContent=t.toFixed(1)+'°';$('results').classList.remove('hidden');$('nores').classList.add('hidden')}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return,u=URL.createObjectURL(f);img.onload=()=>{has=true;pts=[];included=null;cv.width=900;cv.height=Math.max(420,Math.min(900,900/(img.width/img.height)));draw();bd();URL.revokeObjectURL(u)};img.src=u};
cv.onpointerdown=e=>{if(pts.length>=3)return;let r=cv.getBoundingClientRect();pts.push({x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height});draw();bd();if(pts.length==3)photoCalc()};
$('undo').onclick=()=>{pts.pop();included=null;draw();bd()};$('reset').onclick=()=>{pts=[];included=null;draw();bd()};
$('shape').onchange=()=>{let d=$('shape').value=='diff';$('same').classList.toggle('hidden',d);$('diff').classList.toggle('hidden',!d);calc()};$('split').onchange=()=>{$('custom').classList.toggle('hidden',$('split').value!='custom');calc()};
['width','topWidth','bottomWidth','unit','turn','leftAngle','rightAngle'].forEach(x=>$(x).addEventListener('input',calc));draw();bd();calc();
</script></body></html>
